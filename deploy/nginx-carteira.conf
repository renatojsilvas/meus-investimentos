# Adicionar em /etc/nginx/sites-enabled/tesouro-direto, dentro do server { listen 3080; } (HTTP, sem SSL).
# Usa o map $connection_upgrade já definido no topo desse arquivo.
# Depois: sudo nginx -t && sudo systemctl reload nginx
# Acesso: http://<IP-da-VPS>:3080/carteira/

location = /carteira { return 301 /carteira/; }

location /carteira/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
}
