# Reproduz GET /api/v1/precos da API tesouro-direto, a partir da fixture
# real tests/e2e/fixtures/precos-2026-09-25.http (corpo e headers), e
# GET /dados/serie/bcdata.sgs.12/dados da API SGS do BCB, a partir da
# fixture real tests/e2e/fixtures/cdi-2025-01.http (corpo e headers).
# Os parâmetros de data (dataInicial/dataFinal/formato) são ignorados:
# `location =` casa só o caminho, a query string nunca entra no match.
server {
    listen 80 default_server;
    server_name fakeapi;

    location = /dados/serie/bcdata.sgs.12/dados {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=900" always;
        add_header ETag "W/\"387-kk7D7mpfqYyO8glmCZioR0IPQBU\"" always;

        alias /usr/share/nginx/html/cdi.json;
    }

    location = /api/v1/precos {
        if ($http_x_api_key = "") {
            return 401;
        }

        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=300" always;
        add_header ETag "\"a9b7b37b5ddd208e\"" always;
        add_header X-Total-Count "58" always;
        add_header X-Correlation-Id "43fd3137-2b60-45ae-b5d4-3f96db93310d" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept-Encoding" always;

        alias /usr/share/nginx/html/precos.json;
    }

    location / {
        return 404;
    }
}
