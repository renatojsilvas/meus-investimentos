services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: carteira
      POSTGRES_DB: carteira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - carteira_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira -d carteira"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  carteira_pgdata:
